name: Publish verified CLI release

on:
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:
    inputs:
      version:
        description: Stable version to publish, without the v prefix
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: agents-cli-public-release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: "24.11.0"
      - uses: oras-project/setup-oras@0d9191fa0dd41eaefe9e28b375a02290706ce51d
        with:
          version: 1.3.3
      - name: Verify and publish missing releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/publish-release "${{ inputs.version }}"
