name: Publish verified CLI release

on:
  push:
    branches:
      - release-relay

permissions:
  contents: write

concurrency:
  group: agents-cli-public-release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 1
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: "24.11.0"
      - name: Verify and publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/publish-release bundle
      - name: Remove processed relay
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          current_sha="$(gh api "/repos/$GITHUB_REPOSITORY/git/ref/heads/release-relay" --jq '.object.sha')"
          if test "$current_sha" = "$GITHUB_SHA"; then
            gh api --method DELETE "/repos/$GITHUB_REPOSITORY/git/refs/heads/release-relay"
          fi
